name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [principal, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extrair projeto
        run: unzip -o "Tarefas-Diárias-Projeto (1).zip"

      - name: Gerar APK
        working-directory: tarefas-diarias
        run: gradle :app:assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Tarefas-Diarias-APK
          path: tarefas-diarias/app/build/outputs/apk/debug/app-debug.apk
